<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markets — Moomoo Insights</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .mover-up { color: #16a34a; font-weight: 700; }
    .mover-dn { color: #dc2626; font-weight: 700; }
    .market-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 32px; }
    .source-tag { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .openD-note { background: #fff7f0; border: 1px solid #fed7aa; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #92400e; margin-bottom: 20px; }
    .beat-pill  { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; }
    .beat-pos   { background:#dcfce7; color:#166534; }
    .beat-neg   { background:#fee2e2; color:#991b1b; }
    .beat-neu   { background:#f1f5f9; color:#64748b; }
    .day-badge  { display:inline-block; padding:2px 7px; border-radius:6px; font-size:11px; font-weight:600; background:#f0f4ff; color:#3b5bdb; }
    .earnings-row:hover td { background:#fafafa; }
    .earn-filter { padding:4px 12px; border-radius:16px; border:1px solid var(--border); background:#fff; font-size:12px; font-weight:500; color:var(--text-muted); cursor:pointer; transition:all 0.15s; }
    .earn-filter:hover { border-color:var(--orange); color:var(--orange); }
    .earn-filter.active { background:var(--orange); border-color:var(--orange); color:#fff; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">moomoo<span>Insights</span></div>
    <div class="nav-links" id="nav-links"></div>
    <div id="nav-user-info"></div>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<div class="ticker-bar" id="ticker-bar"></div>

<main class="page">

  <div class="section-head" style="margin-bottom:16px;">
    <h2 data-i18n="mkt_overview">Market Overview</h2>
    <span class="source-tag" id="data-source" data-i18n="mkt_loading">Loading…</span>
  </div>


  <!-- Index cards -->
  <div class="grid-4" id="index-cards">
    <div class="stat-card"><div class="label">—</div><div class="value">—</div><div class="change">loading…</div></div>
    <div class="stat-card"><div class="label">—</div><div class="value">—</div><div class="change">loading…</div></div>
    <div class="stat-card"><div class="label">—</div><div class="value">—</div><div class="change">loading…</div></div>
    <div class="stat-card"><div class="label">—</div><div class="value">—</div><div class="change">loading…</div></div>
  </div>

  <div style="height:32px;"></div>

  <!-- US Movers -->
  <div class="section-head">
    <h2 data-i18n="mkt_us_movers">US Top Movers</h2>
  </div>
  <div class="card" style="margin-bottom:32px;">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="mkt_ticker">Ticker</th>
            <th data-i18n="mkt_name">Name</th>
            <th data-i18n="mkt_price">Price (USD)</th>
            <th data-i18n="mkt_change_pct">Change %</th>
          </tr>
        </thead>
        <tbody id="movers-body">
          <tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted);" data-i18n="mkt_loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Upcoming Earnings -->
  <div class="section-head">
    <h2 data-i18n="mkt_upcoming_earnings">Upcoming Earnings</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
      <button class="earn-filter active" data-days="7" onclick="setEarnFilter(this)" data-i18n="mkt_next7">Next 7d</button>
      <button class="earn-filter" data-days="14" onclick="setEarnFilter(this)" data-i18n="mkt_next14">Next 14d</button>
      <button class="earn-filter" data-days="30" onclick="setEarnFilter(this)" data-i18n="mkt_next30">Next 30d</button>
      <button class="earn-filter" data-days="0" onclick="setEarnFilter(this)" data-i18n="mkt_all_upcoming">All upcoming</button>
    </div>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="mkt_date">Date</th>
            <th data-i18n="mkt_ticker">Ticker</th>
            <th data-i18n="mkt_company">Company</th>
            <th data-i18n="mkt_sector">Sector</th>
          </tr>
        </thead>
        <tbody id="earnings-body">
          <tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted);" data-i18n="mkt_loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<footer class="footer" data-i18n="footer_copy">© 2026 Moomoo Insights</footer>

<script src="i18n.js"></script>
<script src="capacitor.js"></script>
<script src="app.js"></script>
<script>
async function loadMarkets() {
  try {
    const data = await apiGet("/api/markets");

    // Source tag
    const srcEl = document.getElementById("data-source");
    srcEl.textContent = `Source: Yahoo Finance · ${new Date(data.as_of).toLocaleTimeString()}`;

    // Index cards
    const indexOrder = ["SPX","NDX","DJI"];
    const allIndices = data.indices || [];
    const toShow = indexOrder.map(sym => allIndices.find(i => i.symbol === sym)).filter(Boolean);

    const cards = document.getElementById("index-cards");
    cards.style.gridTemplateColumns = `repeat(3, 1fr)`;
    cards.innerHTML = toShow.map(i => {
      const cls = i.change_pct >= 0 ? "up" : "dn";
      const sign = i.change_pct >= 0 ? "+" : "";
      return `<div class="stat-card">
        <div class="label">${i.name}</div>
        <div class="value">${formatPrice(i.price, i.symbol)}</div>
        <div class="change ${cls}">${sign}${i.change.toFixed(2)} &nbsp;<span style="opacity:0.8">(${sign}${i.change_pct.toFixed(2)}%)</span></div>
      </div>`;
    }).join("");

    // Movers
    const movers = data.movers || [];
    const tbody = document.getElementById("movers-body");
    if (!movers.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text-muted);">${t("mkt_no_movers")}</td></tr>`;
    } else {
      tbody.innerHTML = movers.map(m => {
        const cls = m.change_pct >= 0 ? "mover-up" : "mover-dn";
        const sign = m.change_pct >= 0 ? "+" : "";
        return `<tr>
          <td><strong>${m.ticker}</strong></td>
          <td>${m.name || "-"}</td>
          <td>$${m.price.toFixed(2)}</td>
          <td class="${cls}">${sign}${m.change_pct.toFixed(2)}%</td>
        </tr>`;
      }).join("");
    }
  } catch (e) {
    document.getElementById("index-cards").innerHTML = `<div style="grid-column:1/-1;padding:20px;color:var(--text-muted);">Could not load market data: ${e.message}</div>`;
  }
}

function beatPill(pct) {
  if (pct == null) return `<span class="beat-pill beat-neu">TBD</span>`;
  const cls = pct >= 0 ? "beat-pos" : "beat-neg";
  const sign = pct >= 0 ? "+" : "";
  return `<span class="beat-pill ${cls}">${sign}${pct.toFixed(1)}%</span>`;
}

function dayLabel(dateStr) {
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const d = new Date(dateStr + "T00:00:00");
  return `<span class="day-badge">${days[d.getDay()]} ${dateStr.slice(5)}</span>`;
}

let _earnDays = 7;

function setEarnFilter(btn) {
  document.querySelectorAll(".earn-filter").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  _earnDays = parseInt(btn.dataset.days);
  loadEarnings();
}

async function loadEarnings() {
  const tbody = document.getElementById("earnings-body");
  tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">Loading…</td></tr>`;
  try {
    const today = new Date();
    let url = "/api/earnings?upcoming=true";
    if (_earnDays > 0) {
      const to = new Date(today);
      to.setDate(to.getDate() + _earnDays);
      url += `&to_date=${to.toISOString().slice(0,10)}`;
    }
    const data = await apiGet(url);
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted);">${t("mkt_no_earnings")}</td></tr>`;
      return;
    }
    tbody.innerHTML = data.slice(0, 30).map(r => `<tr class="earnings-row">
      <td>${dayLabel(r.report_date)}</td>
      <td><strong>${r.ticker}</strong></td>
      <td>${r.name}</td>
      <td><span class="tag">${r.sector || "-"}</span></td>
    </tr>`).join("");
  } catch {}
}

loadMarkets();
loadEarnings();
setInterval(loadMarkets, 60000);
</script>
</body>
</html>
