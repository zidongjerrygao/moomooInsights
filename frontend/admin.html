<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Moomoo Insights</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .editor-preview { background: white; border: 1.5px solid var(--border); border-radius: 8px; padding: 20px; min-height: 300px; overflow-y: auto; }
    .editor-preview h3 { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
    .ai-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .ai-btn { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light)); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity 0.15s; }
    .ai-btn:hover { opacity: 0.85; }
    .ai-btn.jpm { background: linear-gradient(135deg, #00274c, #004080); }
    .ai-btn.moomoo { background: linear-gradient(135deg, var(--orange), #ff8c00); }
    @media (max-width: 900px) { .editor-grid { grid-template-columns: 1fr; } }
    .article-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .article-row:last-child { border-bottom: none; }
    .article-row-title { flex: 1; font-weight: 600; font-size: 14px; }
    .article-row-meta { font-size: 12px; color: var(--text-muted); }
    .badge-published { background: #dcfce7; color: #16a34a; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .badge-draft { background: #fef3c7; color: #92400e; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">moomoo<span>Insights</span></div>
    <div class="nav-links" id="nav-links"></div>
    <div id="nav-user-info"></div>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<main class="page">

  <div id="admin-gate" style="display:none;">
    <div class="empty-state"><div class="icon">🔒</div><p>Admin access required. <a href="login.html" style="color:var(--orange);">Log in</a></p></div>
  </div>

  <div id="admin-content" style="display:none;">

    <div class="section-head" style="margin-bottom:24px;">
      <h2>Admin Panel</h2>
    </div>

    <div class="admin-tabs">
      <div class="admin-tab active" onclick="switchTab('articles')">Articles</div>
      <div class="admin-tab" onclick="switchTab('community')">Community</div>
      <div class="admin-tab" onclick="switchTab('earnings')">Earnings</div>
    </div>

    <!-- Articles Tab -->
    <div class="admin-panel active" id="tab-articles">

      <div style="display:flex;justify-content:flex-end;margin-bottom:20px;">
        <button class="btn btn-primary" onclick="showNewArticle()">+ New Article</button>
      </div>

      <!-- Article list -->
      <div class="card card-pad" id="article-list-card">
        <div id="article-list"><div class="loading-center"><div class="spinner"></div></div></div>
      </div>

      <!-- New / Edit article form -->
      <div id="article-editor" style="display:none;margin-top:24px;">
        <div class="card card-pad">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
            <h3 style="font-size:18px;font-weight:800;" id="editor-heading">New Article</h3>
            <button class="btn btn-ghost btn-sm" onclick="hideEditor()">✕ Cancel</button>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
            <div class="form-group" style="margin:0;">
              <label>Title</label>
              <input class="form-control" id="a-title" placeholder="Article title" />
            </div>
            <div class="form-group" style="margin:0;">
              <label>Category</label>
              <select class="form-control" id="a-category">
                <option>Market Analysis</option>
                <option>Earnings</option>
                <option>Economy</option>
                <option>SG Market</option>
                <option>US Market</option>
                <option>Tech</option>
                <option>Finance</option>
                <option>Education</option>
                <option>Macro</option>
                <option>Equity</option>
                <option>Credit</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Excerpt</label>
            <textarea class="form-control" id="a-excerpt" style="min-height:60px;" placeholder="Short summary shown on article cards"></textarea>
          </div>
          <div class="form-group">
            <label>Tags (comma-separated)</label>
            <input class="form-control" id="a-tags" placeholder="e.g. Earnings, Q1 2026, MCD" />
          </div>
          <div class="form-group" style="margin-bottom:8px;">
            <label>Content (HTML)</label>
            <div class="ai-btns">
              <button class="ai-btn jpm" onclick="generateJPM()">🏦 Generate JPMorgan Brief</button>
              <button class="ai-btn moomoo" onclick="generateMoomoo()">📊 Generate Moomoo Commentary</button>
            </div>
            <div id="ai-status" style="font-size:12px;color:var(--text-muted);margin-bottom:6px;"></div>
          </div>
          <div class="editor-grid">
            <div>
              <textarea class="form-control" id="a-content" style="min-height:400px;font-family:monospace;font-size:13px;" placeholder="Paste or type HTML content here…" oninput="updatePreview()"></textarea>
            </div>
            <div>
              <div class="editor-preview">
                <h3>Live Preview</h3>
                <div id="content-preview" class="article-content"></div>
              </div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px;margin-top:16px;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
              <input type="checkbox" id="a-published" checked style="width:16px;height:16px;" />
              Published
            </label>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
              <input type="checkbox" id="a-featured" style="width:16px;height:16px;" />
              Featured (shown as hero)
            </label>
            <div style="margin-left:auto;display:flex;gap:10px;">
              <button class="btn btn-ghost" onclick="hideEditor()">Cancel</button>
              <button class="btn btn-primary" onclick="saveArticle()">Save Article</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Community Tab -->
    <div class="admin-panel" id="tab-community">
      <div id="community-list"><div class="loading-center"><div class="spinner"></div></div></div>
    </div>

    <!-- Earnings Tab -->
    <div class="admin-panel" id="tab-earnings">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ticker</th><th>Date</th><th>Quarter</th>
                <th>EPS Act.</th><th>EPS Est.</th><th>EPS Surp%</th>
                <th>Rev Act.</th><th>Stock Rxn%</th>
              </tr>
            </thead>
            <tbody id="earnings-admin-body">
              <tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="footer">© 2026 Moomoo Insights</footer>

<script src="app.js"></script>
<script>
let editingId = null;

function switchTab(name) {
  document.querySelectorAll(".admin-tab").forEach((t, i) => {
    const names = ["articles", "community", "earnings"];
    t.classList.toggle("active", names[i] === name);
  });
  document.querySelectorAll(".admin-panel").forEach(p => p.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  if (name === "community") loadCommunityAdmin();
  if (name === "earnings") loadEarningsAdmin();
}

async function init() {
  const user = getUser();
  if (!user || !user.is_admin) {
    document.getElementById("admin-gate").style.display = "block";
    return;
  }
  document.getElementById("admin-content").style.display = "block";
  loadArticleList();
}

async function loadArticleList() {
  try {
    const articles = await apiGet("/api/articles");
    const container = document.getElementById("article-list");
    if (!articles.length) {
      container.innerHTML = `<div class="empty-state"><div class="icon">📝</div><p>No articles yet.</p></div>`;
      return;
    }
    container.innerHTML = articles.map(a => `
      <div class="article-row">
        <span>${categoryEmoji(a.category)}</span>
        <div style="flex:1;">
          <div class="article-row-title">${a.title}</div>
          <div class="article-row-meta">${a.category} · ${formatDate(a.created_at)}</div>
        </div>
        <span class="${a.published ? "badge-published" : "badge-draft"}">${a.published ? "Published" : "Draft"}</span>
        ${a.featured ? `<span style="font-size:11px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:10px;font-weight:700;">Featured</span>` : ""}
        <button class="btn btn-ghost btn-sm" onclick="editArticle(${a.id})">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteArticleAdmin(${a.id})">Delete</button>
        <a href="article.html?id=${a.id}" class="btn btn-ghost btn-sm" target="_blank">View</a>
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("article-list").innerHTML = `<p style="color:red;">${e.message}</p>`;
  }
}

async function editArticle(id) {
  try {
    const a = await apiGet(`/api/articles/${id}`);
    editingId = id;
    document.getElementById("editor-heading").textContent = "Edit Article";
    document.getElementById("a-title").value   = a.title;
    document.getElementById("a-excerpt").value = a.excerpt || "";
    document.getElementById("a-category").value= a.category || "Market Analysis";
    document.getElementById("a-tags").value    = (a.tags || []).join(", ");
    document.getElementById("a-content").value = a.content_html;
    document.getElementById("a-published").checked = a.published;
    document.getElementById("a-featured").checked  = a.featured;
    updatePreview();
    document.getElementById("article-editor").style.display = "block";
    document.getElementById("article-editor").scrollIntoView({ behavior: "smooth" });
  } catch (e) { toast(e.message, "error"); }
}

function showNewArticle() {
  editingId = null;
  document.getElementById("editor-heading").textContent = "New Article";
  ["a-title","a-excerpt","a-tags","a-content"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("a-published").checked = true;
  document.getElementById("a-featured").checked  = false;
  document.getElementById("content-preview").innerHTML = "";
  document.getElementById("article-editor").style.display = "block";
  document.getElementById("article-editor").scrollIntoView({ behavior: "smooth" });
}

function hideEditor() {
  document.getElementById("article-editor").style.display = "none";
  editingId = null;
}

function updatePreview() {
  document.getElementById("content-preview").innerHTML = document.getElementById("a-content").value;
}

async function saveArticle() {
  const payload = {
    title:        document.getElementById("a-title").value.trim(),
    excerpt:      document.getElementById("a-excerpt").value.trim(),
    category:     document.getElementById("a-category").value,
    tags:         document.getElementById("a-tags").value.split(",").map(s => s.trim()).filter(Boolean),
    content_html: document.getElementById("a-content").value,
    published:    document.getElementById("a-published").checked,
    featured:     document.getElementById("a-featured").checked,
  };
  if (!payload.title || !payload.content_html) { toast("Title and content are required", "error"); return; }
  try {
    if (editingId) {
      await apiPut(`/api/articles/${editingId}`, payload);
      toast("Article updated!", "success");
    } else {
      await apiPost("/api/articles", payload);
      toast("Article published!", "success");
    }
    hideEditor();
    loadArticleList();
  } catch (e) { toast(e.message, "error"); }
}

async function deleteArticleAdmin(id) {
  if (!confirm("Delete this article?")) return;
  try {
    await apiDelete(`/api/articles/${id}`);
    toast("Deleted", "success");
    loadArticleList();
  } catch (e) { toast(e.message, "error"); }
}

async function loadCommunityAdmin() {
  try {
    const posts = await apiGet("/api/community");
    const container = document.getElementById("community-list");
    if (!posts.length) { container.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>No posts.</p></div>`; return; }
    container.innerHTML = `<div class="card card-pad">${posts.map(p => `
      <div class="article-row">
        <div style="flex:1;">
          <div class="article-row-title">${p.title}</div>
          <div class="article-row-meta">${p.category} · ${p.author} · ${formatDate(p.created_at)} · 💬 ${p.comment_count}</div>
        </div>
      </div>`).join("")}</div>`;
  } catch (e) { document.getElementById("community-list").innerHTML = `<p style="color:red;">${e.message}</p>`; }
}

async function loadEarningsAdmin() {
  try {
    const data = await apiGet("/api/earnings");
    const tbody = document.getElementById("earnings-admin-body");
    if (!data.length) { tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--text-muted);">No earnings data.</td></tr>`; return; }
    tbody.innerHTML = data.slice(0, 50).map(r => {
      const ec = r.eps_surprise_pct != null ? (r.eps_surprise_pct >= 0 ? "td-up" : "td-dn") : "";
      const rc = r.stock_reaction_pct != null ? (r.stock_reaction_pct >= 0 ? "td-up" : "td-dn") : "";
      return `<tr>
        <td><strong>${r.ticker}</strong></td>
        <td>${r.report_date}</td>
        <td>${r.fiscal_quarter || "-"}</td>
        <td>${r.eps_actual ?? "-"}</td>
        <td>${r.eps_estimate ?? "-"}</td>
        <td class="${ec}">${r.eps_surprise_pct != null ? (r.eps_surprise_pct > 0 ? "+" : "") + r.eps_surprise_pct.toFixed(2) + "%" : "-"}</td>
        <td>${formatRev(r.revenue_actual)}</td>
        <td class="${rc}">${r.stock_reaction_pct != null ? (r.stock_reaction_pct > 0 ? "+" : "") + r.stock_reaction_pct.toFixed(2) + "%" : "-"}</td>
      </tr>`;
    }).join("");
  } catch (e) { document.getElementById("earnings-admin-body").innerHTML = `<tr><td colspan="8" style="color:red;padding:12px;">${e.message}</td></tr>`; }
}

// ── AI Generation buttons ─────────────────────────────────────────────────────
function generateJPM() {
  const ticker = prompt("Enter ticker for JPMorgan-style brief (e.g. MCD):");
  if (!ticker) return;
  const aiStatus = document.getElementById("ai-status");
  aiStatus.textContent = `Generating JPMorgan brief for ${ticker.toUpperCase()}… (use /jpm-insights in the Claude Code terminal)`;
  aiStatus.style.color = "#92400e";
}

function generateMoomoo() {
  const ticker = prompt("Enter ticker for Moomoo commentary (e.g. MCD):");
  if (!ticker) return;
  const aiStatus = document.getElementById("ai-status");
  aiStatus.textContent = `Run: /moomoo-earnings write Moomoo commentary for ${ticker.toUpperCase()} — then paste the result into the content box above.`;
  aiStatus.style.color = "#1a6b3c";
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
