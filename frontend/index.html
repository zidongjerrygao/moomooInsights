<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moomoo Insights — Market Intelligence</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .section-label { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--orange); margin-bottom:6px; }
    .news-section { margin-bottom:48px; }
    .section-divider { border:none; border-top:1px solid var(--border); margin:0 0 32px; }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-logo">moomoo<span>Insights</span></div>
    <div class="nav-links" id="nav-links"></div>
    <div id="nav-user-info"></div>
    <div class="nav-actions" id="nav-actions"></div>
  </div>
</nav>

<div class="ticker-bar" id="ticker-bar"></div>

<main class="page" id="main">
  <div class="loading-center"><div class="spinner"></div></div>
</main>

<footer class="footer">
  <span data-i18n="footer_copy">© 2026 Moomoo Insights</span> · <a href="#" data-i18n="footer_privacy">Privacy</a> · <a href="#" data-i18n="footer_terms">Terms</a>
</footer>

<script src="i18n.js"></script>
<script src="capacitor.js"></script>
<script src="app.js"></script>
<script>
async function loadPage() {
  try {
    const articles = await apiGet("/api/articles");
    const main = document.getElementById("main");

    if (!articles.length) {
      main.innerHTML = `<div class="empty-state"><div class="icon">📰</div><p>No articles yet. Check back soon.</p></div>`;
      return;
    }

    const dailyBriefs    = articles.filter(a => a.category === "Daily Brief");
    const earningsArts   = articles.filter(a => a.category === "Earnings");
    const marketAnalysis = articles.filter(a => a.category === "Market Analysis");

    // Featured = most recently published across all 3 sections
    const candidates = [...dailyBriefs, ...earningsArts, ...marketAnalysis];
    const featured = candidates.reduce((a, b) =>
      new Date(a.created_at) > new Date(b.created_at) ? a : b
    );

    let html = `
      <a href="article.html?id=${featured.id}" class="hero-article" style="text-decoration:none;color:inherit;">
        <div class="hero-article-img" style="padding:0;overflow:hidden;">${articleThumbnailSVG(featured)}</div>
        <div class="hero-article-body">
          <span class="hero-tag">${featured.category || "Featured"}</span>
          <h1 class="hero-title">${featured.title}</h1>
          <p class="hero-excerpt">${featured.excerpt || ""}</p>
          <div class="hero-meta">${normalizeAuthor(featured.author)} · ${formatDate(featured.created_at)}</div>
        </div>
      </a>
    `;

    // ── Section 1: Daily Market Brief ──────────────────────────────
    html += `<hr class="section-divider">`;
    html += `<div class="news-section">`;
    html += `<div class="section-label">Daily Market Brief</div>`;
    html += `<div class="section-head" style="margin-bottom:20px;"><h2>${t("idx_daily_brief")}</h2></div>`;
    const briefsToShow = dailyBriefs.filter(a => a.id !== featured.id);
    if (dailyBriefs.length) {
      html += `<div class="grid-3">${dailyBriefs.slice(0, 6).map(a => a.id === featured.id ? '' : articleCardHTML(a)).filter(Boolean).join("") || dailyBriefs.slice(0, 6).map(articleCardHTML).join("")}</div>`;
    } else {
      html += `<div class="empty-state" style="padding:24px 0;"><p>Market briefs appear here each morning at 8:30 AM.</p></div>`;
    }
    html += `</div>`;

    // ── Section 2: Earnings ────────────────────────────────────────
    html += `<hr class="section-divider">`;
    html += `<div class="news-section">`;
    html += `<div class="section-label">Earnings</div>`;
    html += `<div class="section-head" style="margin-bottom:20px;"><h2>${t("idx_earnings")}</h2></div>`;
    if (earningsArts.length) {
      html += `<div class="grid-3">${earningsArts.slice(0, 6).map(a => a.id === featured.id ? '' : articleCardHTML(a)).filter(Boolean).join("") || earningsArts.slice(0, 6).map(articleCardHTML).join("")}</div>`;
    } else {
      html += `<div class="empty-state" style="padding:24px 0;"><p>Earnings previews and reviews appear here automatically.</p></div>`;
    }
    html += `</div>`;

    // ── Section 3: Market Analysis ────────────────────────────────
    html += `<hr class="section-divider">`;
    html += `<div class="news-section">`;
    html += `<div class="section-label">Market Analysis</div>`;
    html += `<div class="section-head" style="margin-bottom:20px;"><h2>In-Depth Research</h2></div>`;
    if (marketAnalysis.length) {
      html += `<div class="grid-3">${marketAnalysis.slice(0, 6).map(a => a.id === featured.id ? '' : articleCardHTML(a)).filter(Boolean).join("") || marketAnalysis.slice(0, 6).map(articleCardHTML).join("")}</div>`;
    } else {
      html += `<div class="empty-state" style="padding:24px 0;"><p>Thematic research published every Thursday and Friday.</p></div>`;
    }
    html += `</div>`;

    main.innerHTML = html;
  } catch (e) {
    document.getElementById("main").innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Could not load articles. Is the server running?<br><small>${e.message}</small></p></div>`;
  }
}

loadPage();
</script>
</body>
</html>
